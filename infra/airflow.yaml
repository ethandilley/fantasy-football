executor: CeleryExecutor

apiSecretKey: "d7b9586092839ef8871b5ed662d9bafcec2becf9b51a74d2ee79029c4cdd6e74"

images:
  airflow:
    repository: 192.168.0.69:30500/airflow
    tag: "1.0"
    pullPolicy: Always
  pod_template:
    repository: 192.168.0.69:30500/airflow
    tag: "1.0"
  statsd:
    repository: 192.168.0.69:30500/airflow
    tag: "1.0"

dags:
  gitSync:
    enabled: true
    repo: https://github.com/ethandilley/fantasy-football.git
    branch: main
    subPath: "airflow/dags"
    recommendedProbeSetting: true

redis:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: stone

data:
  brokerUrlSecretName: airflow-broker-url-secret

flower:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

statsd:
  enabled: false

postgresql:
  primary:
    nodeSelector:
      kubernetes.io/hostname: stone
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      size: 1Gi

logs:
  persistence:
    enabled: false

workers:
  celery:
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        cpu: 2000m
        memory: 4Gi
extraEnv: |
  - name: AIRFLOW__CELERY__WORKER_LOG_SERVER_HOST
    valueFrom:
      fieldRef:
        fieldPath: status.podIP

apiServer:
  livenessProbe:
    timeoutSeconds: 30
    periodSeconds: 30
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 30
    periodSeconds: 30
    failureThreshold: 5
  startupProbe:
    timeoutSeconds: 30
    periodSeconds: 10
    failureThreshold: 30
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

scheduler:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1Gi
  livenessProbe:
    timeoutSeconds: 60
    periodSeconds: 60
    failureThreshold: 5
  startupProbe:
    timeoutSeconds: 60
    periodSeconds: 10
    failureThreshold: 30

dagProcessor:
  enabled: true

config:
  AIRFLOW__CORE__LOAD_EXAMPLES:
    value: "false"
#   AIRFLOW__CORE__PARALLELISM:
#     value: "16"  # can run more in parallel now across workers
#   AIRFLOW__CORE__DAG_CONCURRENCY:
#     value: "16"
#   AIRFLOW__CELERY__WORKER_CONCURRENCY:
#     value: "8"  # tasks per worker at once; tune to your workload
#   AIRFLOW__SCHEDULER__MAX_THREADS:
#     value: "2"
#   AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL:
#     value: "60"
#   AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL:
#     value: "120"
#   AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE:
#     value: "5"
#   AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW:
#     value: "5"
